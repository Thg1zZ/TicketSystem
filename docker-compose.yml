name: ticket-system

# Credenciais vêm do ambiente (ou de um .env, ver .env.example). Os padrões abaixo são só de desenvolvimento:
# todas as portas escutam apenas em 127.0.0.1, então não ficam acessíveis pela rede.

services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: tickets
      POSTGRES_USER: ${DB_USERNAME:-ticket}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ticket}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d tickets"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine@sha256:71885d8cc6e42f2bc0aa2eb853bfc4be200b5108a46ac50e117ae1df0531fb80
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-ticket}
      REDISCLI_AUTH: ${REDIS_PASSWORD:-ticket}
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine@sha256:6cb708876a6163c93f1e5af03a649db13765027ff7a7d775c01a63b6a80545ee
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-ticket}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-ticket}
    ports:
      - "127.0.0.1:5673:5672"
      - "127.0.0.1:15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # N réplicas sem porta publicada; o tráfego entra pelo nginx
  app:
    build: .
    deploy:
      replicas: ${APP_REPLICAS:-3}
    # Sem swap: estourar o limite vira OOM visível em vez de pausas de GC de segundos
    mem_limit: ${APP_MEMORY:-1g}
    memswap_limit: ${APP_MEMORY:-1g}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tickets
      DB_USERNAME: ${DB_USERNAME:-ticket}
      DB_PASSWORD: ${DB_PASSWORD:-ticket}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-ticket}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-ticket}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-ticket}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-admin-token}
      TICKET_RESERVATION_STRATEGY: ${STRATEGY:-pessimistic}
      # Fila virtual (sala de espera) e rate limit por usuário/IP
      TICKET_QUEUE_ENABLED: ${QUEUE_ENABLED:-false}
      TICKET_QUEUE_ADMISSIONS_PER_SECOND: ${QUEUE_ADMISSIONS_PER_SECOND:-100}
      QUEUE_PASS_SECRET: ${QUEUE_PASS_SECRET:-local-dev-queue-pass-secret-change-me}
      TICKET_RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      # Actuator completo só na porta interna 8082 (rede do Docker, sem publicar no host);
      # a porta pública mantém apenas /livez e /readyz
      MANAGEMENT_SERVER_PORT: 8082
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  nginx:
    image: nginx:1.30.6-alpine@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    mem_limit: 128m

  # Observabilidade opcional: docker compose --profile observability up -d
  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    mem_limit: 512m

  grafana:
    image: grafana/grafana:13.2.5@sha256:9f7aa1e1e3246aade5792d35a738049f7f32f89cd51d1956cf426a4e86268a84
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USERNAME:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-ticket}
      # Só leitura sem login, para abrir o painel direto (a porta só escuta em 127.0.0.1)
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ticket-system.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    mem_limit: 768m

  # Só roda com --profile loadtest e --no-deps, sem recriar o app (ver loadtest/run-all.sh)
  k6:
    image: grafana/k6:2.3.0@sha256:2dd4756ec6e14e62778916e1eb850108e4b499304c02df56760fa0bdb0fba0b8
    profiles: ["loadtest"]
    environment:
      BASE_URL: http://nginx:8081
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-admin-token}
      RESULT_NAME: ${RESULT_NAME:-local}
      USERS: ${USERS:-5000}
      VUS: ${VUS:-1000}
      QUEUE: ${QUEUE_ENABLED:-false}
    volumes:
      - ./loadtest:/scripts
    command: ["run", "--quiet", "/scripts/${K6_SCRIPT:-seat-rush.js}"]

volumes:
  pgdata:
