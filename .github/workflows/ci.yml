name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the job only reads the repository
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to a commit SHA (a tag can be moved); Dependabot keeps them up to date
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, testes e portão de cobertura (Testcontainers usa o Docker do runner)
        run: chmod +x mvnw && ./mvnw -B verify

      - name: Resumo da cobertura
        if: always() && hashFiles('target/site/jacoco/jacoco.csv') != ''
        run: |
          awk -F, 'NR>1 {lm+=$8; lc+=$9; bm+=$6; bc+=$7}
            END {printf "### Cobertura de testes\n| Linhas | Branches |\n|---|---|\n| %.1f%% | %.1f%% |\n",
                 100*lc/(lm+lc), 100*bc/(bm+bc)}' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"

      - name: Relatório de cobertura
        if: always() && hashFiles('target/site/jacoco/index.html') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14
