name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the job only reads the repository
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to a commit SHA (a tag can be moved); Dependabot keeps them up to date
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build e testes (Testcontainers usa o Docker do runner)
        run: chmod +x mvnw && ./mvnw -B verify
