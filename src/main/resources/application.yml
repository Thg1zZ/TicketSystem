server:
  port: 8081

spring:
  application:
    name: ticket-system
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5433/tickets
    username: ticket
    password: ticket
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
  data:
    redis:
      host: localhost
      port: 6380
  rabbitmq:
    host: localhost
    port: 5673
    username: ticket
    password: ticket

ticket:
  reservation:
    strategy: pessimistic # pessimistic | optimistic | redis | conditional
  hold:
    ttl: PT10M
    cleanup-interval: PT30S
  checkout:
    pending-stale-after: PT2M
    recovery-interval: PT1M
  payment:
    min-latency: PT0.05S
    max-latency: PT0.3S
    failure-rate: 0.1

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
