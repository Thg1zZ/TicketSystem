server:
  port: 8081

# Credenciais vêm de variáveis de ambiente; os padrões existem só para rodar localmente (ver .env.example)
spring:
  application:
    name: ticket-system
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5433/tickets
    username: ${DB_USERNAME:ticket}
    password: ${DB_PASSWORD:ticket}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
  data:
    redis:
      host: localhost
      port: 6380
      password: ${REDIS_PASSWORD:ticket}
  rabbitmq:
    host: localhost
    port: 5673
    username: ${RABBITMQ_USERNAME:ticket}
    password: ${RABBITMQ_PASSWORD:ticket}
    publisher-confirm-type: simple
    publisher-returns: true
    template:
      mandatory: true # unroutable messages come back to the returns callback instead of vanishing
    listener:
      simple:
        default-requeue-rejected: false # retries exhausted -> dead-letter queue, never an infinite requeue loop
        retry:
          enabled: true
          max-retries: 2
          initial-interval: 1s
          multiplier: 2

ticket:
  admin:
    token: ${ADMIN_TOKEN:} # empty = admin operations (creating events) disabled
  http:
    max-request-body: 64KB
  reservation:
    strategy: pessimistic # pessimistic | optimistic | conditional | redis
  hold:
    ttl: PT10M
    cleanup-interval: PT30S
  checkout:
    pending-stale-after: PT2M
    recovery-interval: PT1M
  payment:
    min-latency: PT0.05S
    max-latency: PT0.3S
    failure-rate: 0.1
  outbox:
    relay-interval: PT0.5S
  notification:
    failure-rate: 0

# No compose o Actuator vai para a porta interna 8082 (MANAGEMENT_SERVER_PORT) com prometheus/metrics;
# na porta pública ficam só /livez e /readyz
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-components: always # UP/DOWN of db, redis, rabbit...
      show-details: never     # ...but no versions, disk paths or other internals
      probes:
        enabled: true
        add-additional-paths: true # /livez and /readyz on the main port, even when management moves away
      group:
        readiness:
          include: readinessState,db # Redis and RabbitMQ outages degrade features, they don't make us unready
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true # buckets let Prometheus compute p95/p99 across instances
      minimum-expected-value:
        http.server.requests: 5ms
      maximum-expected-value:
        http.server.requests: 30s # above the ceiling everything lands in +Inf, so keep it past the worst tail seen

springdoc:
  swagger-ui:
    path: /swagger-ui.html
