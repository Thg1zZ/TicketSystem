server:
  port: 8081
  # Client IP from X-Forwarded-For, trusted only from private-network proxies (nginx overwrites the header)
  forward-headers-strategy: native

# Credenciais vêm de variáveis de ambiente; os padrões existem só para rodar localmente (ver .env.example)
spring:
  application:
    name: ticket-system
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5433/tickets
    username: ${DB_USERNAME:ticket}
    password: ${DB_PASSWORD:ticket}
    hikari:
      # Rule with N instances: N x pool <= Postgres max_connections (100) - reserve for admin/migrations
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
  data:
    redis:
      host: localhost
      port: 6380
      password: ${REDIS_PASSWORD:ticket}
      # Fail fast: Lettuce would wait 60 s per command on a stuck Redis; every Redis use has a fallback
      timeout: 1s
      connect-timeout: 1s
  rabbitmq:
    host: localhost
    port: 5673
    username: ${RABBITMQ_USERNAME:ticket}
    password: ${RABBITMQ_PASSWORD:ticket}
    publisher-confirm-type: simple
    publisher-returns: true
    template:
      mandatory: true # unroutable messages come back to the returns callback instead of vanishing
    listener:
      simple:
        default-requeue-rejected: false # retries exhausted -> dead-letter queue, never an infinite requeue loop
        retry:
          enabled: true
          max-retries: 2
          initial-interval: 1s
          multiplier: 2

ticket:
  admin:
    token: ${ADMIN_TOKEN:} # empty = admin operations (creating events) disabled
  http:
    max-request-body: 64KB
  reservation:
    strategy: pessimistic # pessimistic | optimistic | conditional | redis
  hold:
    ttl: PT10M
    cleanup-interval: PT30S
  checkout:
    pending-stale-after: PT2M
    recovery-interval: PT1M
  payment:
    min-latency: PT0.05S
    max-latency: PT0.3S
    failure-rate: 0.1
    timeout: PT3S              # like an HTTP read timeout: the charge goes on, its outcome is unknown (503)
    max-concurrent: 100        # bulkhead: calls in flight per instance; more are rejected at once (503)
  outbox:
    relay-interval: PT0.5S
  seat-map:
    cache-ttl: PT0.5S          # readers may see a map up to this old; the database sees one load per TTL
    push-interval: PT0.5S      # how often each instance checks watched maps for changes (SSE)
    heartbeat-interval: PT15S
    stream-timeout: PT30M      # EventSource reconnects by itself after this
    max-streams: 2000          # per instance; above it clients get 503 and fall back to polling
  queue:
    enabled: false             # waiting room: holds then require the X-Queue-Pass of an admitted buyer
    admissions-per-second: 100 # across all replicas
    pass-ttl: PT15M            # longer than a hold, so an admitted buyer can still pay
    pass-secret: ${QUEUE_PASS_SECRET:} # HMAC key, at least 32 bytes; required when the queue is on
  rate-limit:
    enabled: true
    per-ip:                    # generous: many people can share an IP (NAT, mobile carriers)
      capacity: 100
      refill-per-second: 50
    per-user:
      capacity: 5
      refill-per-second: 1
  notification:
    failure-rate: 0

# No compose o Actuator vai para a porta interna 8082 (MANAGEMENT_SERVER_PORT) com prometheus/metrics;
# na porta pública ficam só /livez e /readyz
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-components: always # UP/DOWN of db, redis, rabbit...
      show-details: never     # ...but no versions, disk paths or other internals
      probes:
        enabled: true
        add-additional-paths: true # /livez and /readyz on the main port, even when management moves away
      group:
        readiness:
          include: readinessState,db # Redis and RabbitMQ outages degrade features, they don't make us unready
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true # buckets let Prometheus compute p95/p99 across instances
      minimum-expected-value:
        http.server.requests: 5ms
      maximum-expected-value:
        http.server.requests: 30s # above the ceiling everything lands in +Inf, so keep it past the worst tail seen

# Circuit breakers: after repeated failures, stop calling the dependency for a while and fail fast
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      payment:
        wait-duration-in-open-state: 10s
      redis:
        wait-duration-in-open-state: 5s

springdoc:
  swagger-ui:
    path: /swagger-ui.html
