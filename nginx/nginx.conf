# Balanceador na frente das réplicas do app. Única porta publicada para a API (127.0.0.1:8081).
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    server_tokens off;
    access_log off; # o k6 gera dezenas de milhares de linhas; métricas ficam no Prometheus

    # DNS interno do Docker: re-resolve "app" para acompanhar réplicas recriadas ou escaladas
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream app {
        zone app 64k;
        least_conn;                # manda para a réplica com menos requisições em andamento
        server app:8081 resolve;
        keepalive 64;              # reaproveita conexões TCP com as réplicas
    }

    server {
        listen 8081;

        location / {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            # Sobrescreve (não concatena) para o cliente não forjar o IP de origem
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_next_upstream error timeout; # réplica caída: tenta outra (só antes de enviar a requisição)
            proxy_connect_timeout 2s;
            proxy_read_timeout 60s;
        }
    }
}
